[project]
name = "photobooth"
version = "0.1.0"
description = "Photobooth backend"
authors = [
    { name = "Rune Harlyk", email = "rune@harlyk.dk" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "pillow>=13.0.0",
    "segno>=1.6.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
photobooth = "photobooth.__main__:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "trustme>=1.2.1",
]
