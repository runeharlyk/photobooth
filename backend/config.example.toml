share_base_url = "https://photo.example.invalid/p"
media_dir = "../media"

# The occasion each capture is stamped with. Lowercase letters, digits and hyphens, 1-40 characters.
# Photos from any event other than "kitchen" never go to the dorm album.
# event = "kitchen"

# Optional: a TOML document whose share_base_url, event and [timings] override the values here and
# apply without a restart. It is fetched every config_poll_s seconds; the last good copy is cached
# under media_dir as .state/remote-config.cache.toml. GitHub caches raw gist URLs for 5 minutes,
# so an edit can take about 6 minutes to reach the booth.
# remote_config_url = "https://gist.githubusercontent.com/<user>/<id>/raw/photobooth.toml"
# config_poll_s = 60

[camera]
kind = "ffmpeg"
device = "Innomaker-U20CAM-1080p-S1"

# Optional: upload kept captures to the sharing Worker behind share_base_url. Read only at
# startup and never from the remote config; without this table nothing is uploaded.
# The token must match the Worker's UPLOAD_TOKEN secret and is never logged.
# [upload]
# url = "https://photo.runeharlyk.dk"
# token = "<the Worker's UPLOAD_TOKEN>"
